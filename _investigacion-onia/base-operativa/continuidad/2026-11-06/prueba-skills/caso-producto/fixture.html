<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Sesión técnica</title>
<style>
body{font:16px system-ui;background:#fff;color:#999;margin:0}main{width:980px;margin:40px auto;padding:24px}
h1{color:#176B50}.details{font-size:10px}button{background:#176B50;color:white;border:0;padding:2px;width:20px;height:20px}
*:focus{outline:none} .toggle{color:#176B50;cursor:pointer}#status{color:red}
.badge{animation:pulse .4s infinite alternate}@keyframes pulse{to{transform:scale(1.3)}}
</style></head><body><main>
<h1>Sesión técnica gratuita</h1><p class="details">Fecha por confirmar. Sin cupos disponibles.</p>
<div class="badge">Inscripción abierta</div>
<form id="signup"><input id="mail" placeholder="Tu correo"><select id="topic"><option>Selecciona tema</option><option>Automatización</option></select>
<div class="toggle" onclick="this.textContent='Aceptado'">Acepto recibir noticias opcionales</div>
<button type="submit"><svg width="12" height="12"><path d="M1 6h10M7 2l4 4-4 4" stroke="white"/></svg></button>
<p id="status"></p></form><div style="width:100%;height:180px;background:#e2e8f0">Vista previa ilustrativa</div>
<script>
document.querySelector('#signup').addEventListener('submit',function(e){e.preventDefault();document.querySelector('#status').textContent='Algo salió mal';});
</script></main></body></html>
