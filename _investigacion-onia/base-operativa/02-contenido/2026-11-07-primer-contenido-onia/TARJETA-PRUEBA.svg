<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title description">
  <title id="title">Dos sesiones, mismo cálculo</title>
  <desc id="description">En el piloto de continuidad de ONIA, ambas sesiones obtuvieron 56,50 de total y 9 unidades con datos ficticios.</desc>
  <rect width="1080" height="690" rx="42" fill="#101a17"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="92" font-size="32" font-weight="700" letter-spacing="3" fill="#a6efb8">PRUEBA ONIA</text>
    <text x="1016" y="92" text-anchor="end" font-size="30" fill="#dbe7e0">Datos ficticios</text>
    <text x="64" y="192" font-size="67" font-weight="700" fill="#f5fff8">Dos sesiones,</text>
    <text x="64" y="270" font-size="67" font-weight="700" fill="#f5fff8">mismo cálculo.</text>
    <rect x="64" y="320" width="460" height="264" rx="24" fill="#1d2d25"/>
    <rect x="556" y="320" width="460" height="264" rx="24" fill="#1d2d25"/>
    <g fill="#dbe7e0" font-size="34">
      <text x="100" y="383">Sesión A</text>
      <text x="592" y="383">Sesión B</text>
    </g>
    <g fill="#a6efb8" font-size="90" font-weight="700">
      <text x="100" y="483">56,50</text>
      <text x="592" y="483">56,50</text>
    </g>
    <g fill="#dbe7e0" font-size="31">
      <text x="100" y="539">9 unidades</text>
      <text x="592" y="539">9 unidades</text>
    </g>
    <text x="64" y="640" font-size="26" fill="#b9cabe">Recreación del piloto de continuidad · 6 nov 2026</text>
  </g>
</svg>
