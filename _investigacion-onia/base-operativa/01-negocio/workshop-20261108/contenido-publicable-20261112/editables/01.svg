<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#102D32"/><rect x="72" y="70" width="98" height="10" fill="#DBED91"/><text x="72" y="110" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#CBD8D4">ONIA  /  PRÁCTICA CON IA</text><text x="72" y="180" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#DBED91">REVISAR TAMBIÉN ES TRABAJAR</text><text x="72" y="280" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="76" font-weight="700" fill="#F8F4E9">Una agenda prolija</text><text x="72" y="383.36" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="76" font-weight="700" fill="#F8F4E9">puede no entrar.</text><text x="72" y="520.72" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="42" font-weight="400" fill="#F8F4E9">Antes de usarla, compará:</text><text x="72" y="577.84" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">01  ¿Están todas las tareas?</text><text x="72" y="636.32" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">02  ¿Cuánto dura cada una?</text><text x="72" y="694.8000000000001" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">03  ¿Respeta horarios fijos?</text><text x="72" y="1120" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="35" font-weight="700" fill="#DBED91">Si falta algo, pedí la corrección.</text><text x="72" y="1205" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#CBD8D4">P02 · Lista de revisión</text><text x="865" y="1240" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#CBD8D4">