<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#102D32"/><rect x="72" y="70" width="98" height="10" fill="#DBED91"/><text x="72" y="110" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#CBD8D4">ONIA  /  PRÁCTICA CON IA</text><text x="72" y="180" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#DBED91">CASO FICTICIO · P03</text><text x="72" y="280" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="72" font-weight="700" fill="#F8F4E9">Pero faltan 10 min.</text><text x="72" y="411.92" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="42" font-weight="400" fill="#F8F4E9">Inventario pasa de 25 a 50 min.</text><text x="72" y="469.04" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="53" font-weight="700" fill="#F8F4E9">50 − 25 = 25 min más</text><text x="72" y="541.12" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">105 + 25 = 130 min de tareas</text><text x="72" y="599.6" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">130 − 120 = 10 min de más</text><text x="72" y="692.08" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="54" font-weight="700" fill="#F8F4E9">Decidí qué cambia.</text><text x="72" y="765.5200000000001" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="43" font-weight="400" fill="#F8F4E9">Después, ajustá el plan.</text><text x="72" y="1120" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="35" font-weight="700" fill="#DBED91">Una tabla ordenada no arregla la cuenta.</text><text x="72" y="1205" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#CBD8D4">Ejemplo preparado · no es un resultado de alumno</text><text x="865" y="1240" dominant-baseline="text-before-edge" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#CBD8D4">03 / 05</text></svg>